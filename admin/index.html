<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Studio sign-in — In2Skin</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap header-in">
        <a class="brand" href="/" aria-label="In2Skin — home"><span class="brand-text"><span class="wordmark">In2Skin</span><span class="tagline">Aesthetics · Bolton</span></span></a>
      </div>
    </header>
    <main class="wrap" style="max-width:520px; padding:48px 20px 80px;">
      <div class="book-step on">
        <h1 style="font-family:'Cormorant Garamond',serif; font-size:1.9rem; margin-bottom:6px;">Studio sign-in</h1>
        <p class="sub">For the studio only. Sign in once — you stay signed in for 30 days.</p>
        <div id="adminMsg" style="min-height:1.4em; color:#7A3B2E; margin-bottom:10px;"></div>

        <h3 style="font-size:1.2rem; margin:18px 0 8px;">Magic link — no password</h3>
        <form id="magicForm">
          <div class="field"><label for="mgEmail">Studio email</label><input id="mgEmail" type="email" autocomplete="email" placeholder="studio email" /></div>
          <button type="submit" class="btn btn-book btn-big" style="width:100%;">Email me a sign-in link →</button>
        </form>

        <h3 style="font-size:1.2rem; margin:26px 0 8px;">Or sign in with a password</h3>
        <p class="sub">Password sign-in is not set up yet — use the magic link above.</p>
        <p class="fine" style="margin-top:20px;">This page is private — it is not linked from the public site.</p>
      </div>
    </main>
    <script>
      (function(){
        var msg = document.getElementById("adminMsg");
        function show(t, ok){ msg.textContent = t; msg.style.color = ok ? "#2F4A2C" : "#7A3B2E"; }
        // Already signed in? Go straight to the dashboard.
        fetch("/api/admin/session").then(function(r){ return r.json(); }).then(function(j){
          if (j.signedIn) window.location.href = "/admin/dashboard.html";
        }).catch(function(){});
        // Magic-link token in the URL? Exchange it for a session.
        var token = new URLSearchParams(location.search).get("token");
        if (token){
          show("Signing you in…");
          fetch("/api/admin/verify", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ token: token }) })
            .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
            .then(function(res){
              if (res.ok){ window.location.href = "/admin/dashboard.html"; }
              else show(res.j.error || "That link did not work — request a fresh one.");
            })
            .catch(function(){ show("Could not reach the sign-in service — check your connection and try again."); });
        }
        document.getElementById("magicForm").addEventListener("submit", function(ev){
          ev.preventDefault();
          var email = document.getElementById("mgEmail").value.trim();
          if (!email || email.indexOf("@") < 1){ show("Please add the studio email."); return; }
          show("Sending…", true);
          fetch("/api/admin/magic-link", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email: email }) })
            .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
            .then(function(res){ show(res.j.message || res.j.error || "Done.", res.ok); })
            .catch(function(){ show("Could not reach the sign-in service — check your connection and try again."); });
        });
        // Password sign-in is not set up yet (no ADMIN_PASSWORD) — the
        // password form is hidden until one is set; magic link only.
      })();
    </script>
  </body>
</html>
